name: Automated Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    name: Flutter test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Functional, Network, and Security Tests
        run: flutter test
