    .download { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; margin-top: 27px; padding: 0 24px; border-radius: 15px; background: linear-gradient(110deg,#99efd9,#89caff); box-shadow: 0 13px 30px rgba(75,197,207,.21); color: #092631; font-size: 14px; font-weight: 800; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; }
    .download:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(75,197,207,.34); }
    .download:focus-visible,.brand:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .version { margin: 12px 0 0; color: #8099aa; font-size: 12px; }
    .qr-panel { display: flex; flex-direction: column; align-items: center; width: 226px; padding: 17px 17px 18px; border: 1px solid rgba(255,255,255,.14); border-radius: 25px; background: rgba(255,255,255,.07); text-align: center; }
    .qr-shell { padding: 12px; border-radius: 15px; background: #fff; }
    #qrcode,#qrcode canvas,#qrcode img { display: block; width: 176px !important; height: 176px !important; }
    #qrcode.qr-error { display: grid; place-items: center; padding: 12px; color: #102535; font-size: 12px; line-height: 1.4; }
    .qr-title { margin: 14px 0 2px; font-size: 13px; font-weight: 800; }
    .qr-hint { margin: 0; color: #9eb2c0; font-size: 11px; }
    @media (max-width: 700px) {
      .header { width: min(100% - 32px,480px); padding-block: 14px 3px; }
      .header-note { display: none; }
      main { padding: 6px 16px; }
      .card { width: min(100%,480px); grid-template-columns: 1fr; justify-items: center; gap: 15px; padding: 21px 19px; border-radius: 27px; text-align: center; }
      .copy { display: flex; flex-direction: column; align-items: center; }

      .intro { max-width: 370px; font-size: 13px; line-height: 1.45; }
      .download { width: min(100%,300px); min-height: 46px; margin-top: 14px; }
      .version { margin-top: 7px; font-size: 11px; }
      .qr-panel { width: auto; padding: 9px; border: 0; background: none; }
      .qr-shell { padding: 10px; border-radius: 13px; }
      #qrcode,#qrcode canvas,#qrcode img { width: 148px !important; height: 148px !important; }
      .qr-title,.qr-hint { display: none; }
    }
    @media (max-width: 700px) and (max-height: 650px) {
      .header { padding-top: 9px; }
      .brand-icon { width: 32px; height: 32px; }
      .card { gap: 7px; padding: 14px 17px; }
      h1 { font-size: clamp(27px,7.5vw,36px); }
      .intro { font-size: 12px; }
      .download { min-height: 42px; margin-top: 9px; }
      #qrcode,#qrcode canvas,#qrcode img { width: 118px !important; height: 118px !important; }
    }
    @media (max-width: 700px) and (max-height: 510px) {
      .eyebrow,.intro { display: none; }
      .card { grid-template-columns: minmax(0,1fr) auto; text-align: left; }
      .copy { align-items: flex-start; }
      h1 { margin: 0 0 4px; font-size: clamp(24px,5vw,32px); }
      .download { width: auto; padding-inline: 14px; }
      #qrcode,#qrcode canvas,#qrcode img { width: 106px !important; height: 106px !important; }
    }
    @media (min-width: 701px) and (max-height: 650px) {
      .header { padding-top: 12px; }
      .card { padding: 25px 36px; }
      h1 { margin-block: 11px 8px; font-size: clamp(34px,4vw,48px); }

    @media (max-height: 380px) { .qr-panel { display: none; } }

  </style>
</head>
<body class="antialiased">
  <div class="page">
    <header class="header">
      <a class="brand" href="#" aria-label="SmartTimeLog home">
        <span class="brand-icon" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.25" stroke="white" stroke-width="1.8"/><path d="m8.1 12.2 2.5 2.5 5.4-5.6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        SmartTimeLog
      </a>
      <span class="header-note">Android app</span>
    </header>
    <main>
      <section class="card" aria-labelledby="download-heading">
        <div class="copy">
          <span class="eyebrow">Your workday, made simple</span>
          <h1 id="download-heading">Time well spent.<br><span class="gradient-text">Simply tracked.</span></h1>
          <p class="intro">Clock in, track your shift, and keep your attendance close at hand.</p>
          <a id="download-link" class="download" href="https://github.com/jtubianouic/SmartTimeLog/releases/latest/download/app-release.apk" download>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Download for Android
          </a>
          <p class="version">Android APK &middot; Latest release</p>
        </div>
        <div class="qr-panel">
          <div class="qr-shell"><div id="qrcode" role="img" aria-label="QR code linking to the SmartTimeLog Android APK"></div></div>
          <p class="qr-title">Scan to download</p>
          <p class="qr-hint">Open with your phone camera</p>
        </div>
      </section>
    </main>
  </div>
  <script>
    window.addEventListener('load', function () {
      const target = document.getElementById('qrcode');
      if (typeof QRCode === 'undefined') {
        target.classList.add('qr-error');
        target.textContent = 'Use the download button to get the app.';
        return;
      }
      new QRCode(target, {
        text: document.getElementById('download-link').href,
        width: 176, height: 176, colorDark: '#0b1b29', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    });
  </script>
</body>
</html>
